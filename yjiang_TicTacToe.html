<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>Tic Toc Toe</title>
</head>
<body>
<div class="uniformContainer"><h1>Online Tic-Tac-Toe Game</h1></div>

<div class="uniformContainer">
    <p id="messageText">Please choose your side as either 'X' or 'O'</p>
</div>
<div class="uniformContainer">
    <table class="gameboard">
        <tr>
            <td id="00"></td>
            <td id="01"></td>
            <td id="02"></td>
        </tr>
        <tr>
            <td id="10"></td>
            <td id="11"></td>
            <td id="12"></td>
        </tr>
        <tr>
            <td id="20"></td>
            <td id="21"></td>
            <td id="22"></td>
        </tr>
    </table>
    <button class="restart-btn" id="restartBtn">Restart Game</button>
</div>
<script src="function.js"></script>
</body>
</html>
